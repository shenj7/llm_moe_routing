# ============================================================
# Student model config – ~400 M parameters
# ============================================================
# Comfortable fit on an A30 alongside an 8-bit teacher.
# Good starting point to validate the distillation pipeline
# before scaling up to 1 B / 3 B.
# ============================================================

architecture:
  base_model_id: "GSAI-ML/LLaDA-8B-Base"
  trust_remote_code: true

  # ~400 M parameters
  num_hidden_layers: 12
  hidden_size: 1024
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2816
  max_position_embeddings: 4096

  tie_vocab_to_teacher: false
